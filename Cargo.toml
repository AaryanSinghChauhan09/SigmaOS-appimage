[package]
name = "sigmaos_appimage"
version = "0.1.0"
edition = "2021"

[lib]
name = "sigmaos_appimage"
path = "src/lib.rs"

[dependencies]
toml = "0.8"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "rt"] }
log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
